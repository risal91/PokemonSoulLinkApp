<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Link Kurzansicht</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; color: #2d3748; }
        .main-content-wrapper { transform-origin: top center; }
        .container { max-width: 1400px; }
        .level-cap-display-summary { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .route-status-orange, .route-status-orange td { background-color: #ffedd5 !important; }
        .route-status-red, .route-status-red td { background-color: #fee2e2 !important; }
        .custom-select-container { position: relative; width: 100%; }
        .custom-select-input { width: 100%; padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 0.375rem; background-color: #fff; cursor: pointer; text-align: left; position: relative; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; min-height: 2.25rem; /* Feste Höhe für Konsistenz */ }
        .custom-select-input::after { content: '▼'; font-size: 0.6rem; color: #4a5568; position: absolute; right: 0.5rem; }
        .custom-select-options { position: absolute; width: 100%; background-color: #fff; border: 1px solid #ccc; border-radius: 0.375rem; max-height: 200px; overflow-y: auto; z-index: 1000; margin-top: 0.25rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); display: none; }
        .custom-select-options.active { display: block; }
        .custom-select-option { padding: 0.4rem 0.6rem; cursor: pointer; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.875rem; }
        .custom-select-option:hover { background-color: #f0f4f8; }
        .custom-select-option.selected { background-color: #e0e7ff; font-weight: bold; }
        .custom-select-search { width: calc(100% - 1rem); padding: 0.4rem; margin: 0.5rem; border: 1px solid #ccc; border-radius: 0.25rem; box-sizing: border-box; }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="main-content-wrapper">
        <div class="container mx-auto p-8 bg-white rounded-lg shadow-xl">
            <h1 class="text-4xl font-bold text-center text-blue-800 mb-8">Soul Link Kurzansicht</h1>
            <nav class="text-center mb-6 flex justify-center items-center gap-4">
                <a href="/" class="text-blue-600 hover:text-blue-800 text-lg font-medium px-4 py-2 rounded-md bg-blue-100 hover:bg-blue-200 transition duration-300">Zur Hauptansicht</a>
                <button id="zoomOutBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-md transition duration-300 ease-in-out">- Zoom</button>
                <button id="zoomInBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-md transition duration-300 ease-in-out">+ Zoom</button>
                <button id="resetZoomBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-md transition duration-300 ease-in-out">Reset Zoom</button>
            </nav>
            <div id="summaryLevelCapDisplay" class="text-center text-2xl font-bold text-green-700 p-4 mb-8 bg-green-100 rounded-md shadow-inner hidden level-cap-display-summary">
                Nächstes Level Cap: <span id="summaryCurrentLevelCapMax" class="text-green-800"></span> (Angepasst: <span id="summaryCurrentLevelCapAdjusted" class="text-green-800"></span>)
            </div>
            <div id="summaryTableContainer" class="overflow-x-auto"></div>
            <div id="noDataMessage" class="hidden text-center text-gray-500 mt-10">Lade Daten...</div>
        </div>
    </div>

    <script>
        const socket = io();
        let players = [];
        let routes = [];
        let catches = [];
        let globalOrders = [];
        let levelCaps = [];
        let allPokemonData = []; // NEU: Speichert die komplette Liste {id, name}
        let currentZoom = 1.0;
        const zoomStep = 0.1;
        const mainContentWrapper = document.querySelector('.main-content-wrapper');

        const summaryTableContainer = document.getElementById('summaryTableContainer');
        const noDataMessage = document.getElementById('noDataMessage');
        const summaryLevelCapDisplay = document.getElementById('summaryLevelCapDisplay');
        const summaryCurrentLevelCapMax = document.getElementById('summaryCurrentLevelCapMax');
        const summaryCurrentLevelCapAdjusted = document.getElementById('summaryCurrentLevelCapAdjusted');

        function applyZoom() {
            mainContentWrapper.style.transform = `scale(${currentZoom})`;
            mainContentWrapper.style.width = `${100 / currentZoom}%`;
            mainContentWrapper.style.height = `${100 / currentZoom}%`;
        }
        document.getElementById('zoomInBtn').addEventListener('click', () => { currentZoom = Math.min(2.0, currentZoom + zoomStep); applyZoom(); });
        document.getElementById('zoomOutBtn').addEventListener('click', () => { currentZoom = Math.max(0.5, currentZoom - zoomStep); applyZoom(); });
        document.getElementById('resetZoomBtn').addEventListener('click', () => { currentZoom = 1.0; applyZoom(); });

        function setupCustomDropdown(containerElement, inputElement, optionsElement, optionsListElement, searchPlaceholder, initialItemsArray, onSelectCallback = null, hasSearch = false) {
            const searchInput = hasSearch ? optionsDiv.querySelector('.custom-select-search') : null;
            let selectedValue = null; let currentItems = initialItemsArray;
            function renderOptions(filter = '') {
                optionsList.innerHTML = '';
                const filteredItems = currentItems.filter(item => item.toLowerCase().includes(filter.toLowerCase())).sort();
                if (filteredItems.length === 0) { optionsList.innerHTML = '<div class="custom-select-option text-gray-500 italic">Nichts gefunden.</div>'; return; }
                filteredItems.forEach(item => {
                    const option = document.createElement('div'); option.className = 'custom-select-option'; if (item === selectedValue) { option.classList.add('selected'); }
                    option.textContent = item; option.dataset.value = item;
                    option.addEventListener('click', (e) => {
                        e.stopPropagation(); selectedValue = item; optionsDiv.classList.remove('active');
                        if (onSelectCallback) { onSelectCallback(item); }
                    });
                    optionsList.appendChild(option);
                });
            }
            input.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.custom-select-options.active').forEach(openDiv => { if (openDiv !== optionsElement) { openDiv.classList.remove('active'); } });
                optionsElement.classList.toggle('active');
                if (searchInput) { searchInput.value = ''; renderOptions(''); searchInput.focus(); } else { renderOptions(''); }
            });
            if (searchInput) { searchInput.addEventListener('input', (e) => renderOptions(e.target.value)); searchInput.addEventListener('click', (e) => e.stopPropagation()); }
            document.addEventListener('click', () => optionsElement.classList.remove('active'));
            renderOptions();
            return {
                setSelectedValue: (value) => {
                    selectedValue = value;
                    if (onSelectCallback) { onSelectCallback(value); }
                }
            };
        }

        // NEU: Diese Funktion wurde stark überarbeitet
        function createPokemonDropdownSummary(parentElement, initialValue, playerId, routeId) {
            const allPokemonNames = allPokemonData.map(p => p.name);
            const container = document.createElement('div'); container.className = 'custom-select-container';
            const input = document.createElement('div'); input.className = 'custom-select-input'; container.appendChild(input);
            const optionsDiv = document.createElement('div'); optionsDiv.className = 'custom-select-options';
            const searchInput = document.createElement('input'); searchInput.type = 'text'; searchInput.className = 'custom-select-search'; searchInput.placeholder = 'Suche...'; optionsDiv.appendChild(searchInput);
            const optionsList = document.createElement('div'); optionsList.className = 'options-list'; optionsDiv.appendChild(optionsList);
            container.appendChild(optionsDiv);
            parentElement.appendChild(container);

            const updateDisplay = (pokemonName) => {
                input.innerHTML = ''; // Leert das Feld
                if (pokemonName) {
                    const pokemon = allPokemonData.find(p => p.name === pokemonName);
                    if (pokemon) {
                        const img = document.createElement('img');
                        img.src = `/static/icons/${pokemon.id}.png`;
                        img.alt = pokemon.name;
                        img.className = 'h-6 w-6 object-contain mx-auto';
                        img.title = pokemon.name;
                        input.appendChild(img);
                    } else {
                        input.textContent = pokemonName.substring(0, 10); // Fallback
                    }
                } else {
                    input.innerHTML = '&nbsp;'; // Platzhalter, damit die Höhe bleibt
                }
            };
            
            const dropdown = setupCustomDropdown(container, input, optionsDiv, optionsList, 'Pokémon', allPokemonNames, (name) => {
                updateDisplay(name);
                updateCatchOnServer(playerId, routeId, name);
            }, true);

            if (dropdown) dropdown.setSelectedValue(initialValue);
        }

        // Diese Funktion ist fast unverändert, nutzt nur den neuen Callback
        function createStatusDropdownSummary(parentElement, initialStatus, routeId) {
            const statusOptions = ["", "Death Link", "No Catch", ...players.map(p => `Death (${p.name})`)];
            const container = document.createElement('div'); container.className = 'custom-select-container';
            const input = document.createElement('div'); input.className = 'custom-select-input text-sm'; input.tabIndex = 0; container.appendChild(input);
            const optionsDiv = document.createElement('div'); optionsDiv.className = 'custom-select-options';
            const optionsList = document.createElement('div'); optionsList.className = 'options-list'; optionsDiv.appendChild(optionsList);
            container.appendChild(optionsDiv);
            parentElement.appendChild(container);

            const dropdown = setupCustomDropdown(container, input, optionsDiv, optionsList, 'Status', statusOptions, (status) => {
                input.textContent = status || 'Status'; // Aktualisiert die Anzeige
                updateRouteStatusOnServer(routeId, status);
            }, false);
            if (dropdown) dropdown.setSelectedValue(initialStatus);
        }

        async function updateCatchOnServer(playerId, routeId, pokemonName) {
            try { await fetch('/api/update_catch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ player_id: playerId, route_id: routeId, pokemon_name: pokemonName }) }); } catch (error) { console.error('Update fehlgeschlagen:', error); }
        }
        async function updateRouteStatusOnServer(routeId, status) {
            try { await fetch('/api/update_route_status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ route_id: routeId, status_text: status }) }); } catch (error) { console.error('Status-Update fehlgeschlagen:', error); }
        }

        async function fetchDataAndRenderSummary() {
            try {
                const response = await fetch('/api/data'); if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();
                players = data.players; routes = data.routes; catches = data.catches; globalOrders = data.global_orders; levelCaps = data.level_caps; 
                allPokemonData = data.all_pokemon_data || []; // NEU: Nutzt die neuen Daten
                renderSummaryTable();
                renderSummaryLevelCap();
                noDataMessage.classList.toggle('hidden', players.length > 0 || routes.length > 0);
            } catch (error) {
                console.error('Fehler beim Abrufen der Daten:', error);
                noDataMessage.textContent = 'Fehler beim Laden der Daten. Server nicht erreichbar.';
                noDataMessage.classList.remove('hidden');
            }
        }
        
        function renderSummaryTable() {
            summaryTableContainer.innerHTML = '';
            const table = document.createElement('table'); table.className = 'min-w-full bg-white border-collapse';
            const thead = table.createTHead(); thead.className = 'bg-blue-100';
            const headerRow = thead.insertRow();
            const headers = ['Route', ...players.map(p => p.name), 'Status'];
            headers.forEach(text => {
                const th = document.createElement('th');
                th.className = 'py-2 px-3 border-b-2 border-x border-gray-300 text-left text-sm font-semibold text-gray-700 uppercase';
                th.textContent = text;
                headerRow.appendChild(th);
            });
            
            const tbody = table.createTBody();
            routes.forEach(route => {
                const row = tbody.insertRow(); row.id = `summary-route-row-${route.id}`;
                updateRouteRowColor(row, route.status);
                const routeCell = row.insertCell();
                routeCell.className = 'py-2 px-3 border-b border-x border-gray-300 font-medium';
                routeCell.textContent = route.name;
                players.forEach(player => {
                    const playerCell = row.insertCell();
                    playerCell.className = 'py-1 px-2 border-b border-x border-gray-300 w-24';
                    const catchedPoke = catches.find(c => c.player_id === player.id && c.route_id === route.id);
                    createPokemonDropdownSummary(playerCell, catchedPoke ? catchedPoke.pokemon_name : null, player.id, route.id);
                });
                const statusCell = row.insertCell();
                statusCell.className = 'py-1 px-2 border-b border-x border-gray-300';
                createStatusDropdownSummary(statusCell, route.status, route.id);
            });
            summaryTableContainer.appendChild(table);
        }

        function updateRouteRowColor(row, status) {
            row.classList.remove('route-status-orange', 'route-status-red');
            if (status === "Death Link" || status === "No Catch") { row.classList.add('route-status-orange'); } 
            else if (status && status.startsWith("Death (")) { row.classList.add('route-status-red'); }
        }

        function renderSummaryLevelCap() {
            levelCaps.sort((a, b) => a.order_number - b.order_number);
            let nextLevelCap = levelCaps.find(lc => !globalOrders.find(go => go.order_number === lc.order_number)?.is_obtained);
            if (!nextLevelCap && levelCaps.length > 0) { nextLevelCap = levelCaps[levelCaps.length - 1]; }
            if (nextLevelCap) {
                summaryCurrentLevelCapMax.textContent = nextLevelCap.max_level;
                summaryCurrentLevelCapAdjusted.textContent = nextLevelCap.adjusted_level;
                summaryLevelCapDisplay.classList.remove('hidden');
            } else {
                summaryLevelCapDisplay.classList.add('hidden');
            }
        }

        socket.on('connect', () => { console.log('Verbunden (Kurzansicht)'); fetchDataAndRenderSummary(); });
        socket.on('disconnect', () => console.log('Verbindung getrennt (Kurzansicht)'));
        ['player_added', 'route_added', 'route_deleted', 'routes_reordered', 'all_data_reset', 'full_db_reset', 'global_order_toggled', 'catch_updated', 'route_status_updated'].forEach(event => {
            socket.on(event, fetchDataAndRenderSummary);
        });
    </script>
</body>
</html>
