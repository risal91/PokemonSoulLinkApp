<!DOCTYPE html>
<html lang="de" class=""> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Link Kurzansicht</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .main-content-wrapper { transform-origin: top center; transition: background-color 0.3s ease, color 0.3s ease; }
        .container { max-width: 1400px; transition: background-color 0.3s ease; }
        .pokemon-cell { text-align: center; }
        .pokemon-icon-display { height: 40px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
        .pokemon-icon-display img { max-height: 100%; max-width: 100%; object-fit: contain; }
        
        /* Dropdown Styles */
        .custom-select-container { position: relative; width: 100%; }
        .custom-select-input { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 2.25rem; padding: 0.4rem; border: 1px solid #ccc; border-radius: 0.375rem; background-color: #fff; cursor: pointer; text-align: center; font-size: 0.875rem; position: relative; }
        .custom-select-input::after { content: '▼'; font-size: 0.6rem; color: #4a5568; position: absolute; right: 0.5rem; }
        .dark .custom-select-input::after { color: #9ca3af; }
        .custom-select-options { position: absolute; width: 100%; background-color: #fff; border: 1px solid #ccc; border-radius: 0.375rem; max-height: 200px; overflow-y: auto; z-index: 1000; margin-top: 0.25rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; }
        .custom-select-options.active { display: block; }
        .custom-select-option { padding: 0.4rem 0.6rem; cursor: pointer; }
        .custom-select-option:hover { background-color: #f0f4f8; }
        .custom-select-option.selected { background-color: #e0e7ff; font-weight: bold; }
        .custom-select-search { width: calc(100% - 1rem); padding: 0.4rem; margin: 0.5rem; border: 1px solid #ccc; border-radius: 0.25rem; box-sizing: border-box; }
        .dark .custom-select-input, .dark .custom-select-options, .dark .custom-select-search { background-color: #4b5563; color: #e5e7eb; border-color: #6b7280; }
        .dark .custom-select-option:hover { background-color: #374151; }
        .dark .custom-select-option.selected { background-color: #4338ca; }

        /* STATUS-FARBEN */
        .status-no-catch, .status-no-catch td,
        .status-death-link, .status-death-link td { background-color: #ffedd5 !important; }
        .status-player-death, .status-player-death td { background-color: #fee2e2 !important; }

        .dark .status-no-catch, .dark .status-no-catch td { background-color: #1e3a8a !important; color: #bfdbfe !important; }
        .dark .status-death-link, .dark .status-death-link td { background-color: #92400e !important; color: #fde68a !important; }
        .dark .status-player-death, .dark .status-player-death td { background-color: #991b1b !important; color: #fecaca !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900">
    <div class="main-content-wrapper">
        <div class="container mx-auto p-8 bg-white rounded-lg shadow-xl dark:bg-gray-800">
            <h1 class="text-4xl font-bold text-center text-blue-800 mb-8 dark:text-blue-300">Soul Link Kurzansicht</h1>
            <nav class="text-center mb-6 flex justify-center items-center gap-4">
                <a href="/" class="text-blue-600 hover:text-blue-800 text-lg font-medium px-4 py-2 rounded-md bg-blue-100 hover:bg-blue-200 dark:bg-blue-900 dark:text-blue-200 dark:hover:bg-blue-800 transition">Zur Hauptansicht</a>
                <button id="themeToggleBtn" class="bg-gray-200 hover:bg-gray-300 font-bold p-2 rounded-md dark:bg-gray-700 dark:hover:bg-gray-600">
                    <svg id="theme-icon-light" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg id="theme-icon-dark" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                </button>
            </nav>
            <div id="summaryTableContainer" class="overflow-x-auto"></div>
            <div id="noDataMessage" class="hidden text-center text-gray-500 mt-10">Lade Daten...</div>
        </div>
    </div>

    <script>
        const socket = io();
        let allPokemonData = [], players = [], routes = [], catches = [];
        
        // --- UNIVERSALE DROPDOWN LOGIK MIT SUCHE ---
        function setupCustomDropdown(container, placeholder, items, initialValue, onSelectCallback, searchable = false) {
            container.innerHTML = `
                <div class="custom-select-input" tabindex="0"></div>
                <div class="custom-select-options">
                    ${searchable ? '<input type="text" class="custom-select-search" placeholder="Suche...">' : ''}
                    <div class="options-list"></div>
                </div>`;
            
            const input = container.querySelector('.custom-select-input');
            const optionsDiv = container.querySelector('.custom-select-options');
            const optionsList = container.querySelector('.options-list');
            const searchInput = container.querySelector('.custom-select-search');
            let selectedValue = initialValue;

            const renderOptions = (filter = '') => {
                optionsList.innerHTML = '';
                const filteredItems = items.filter(item => item.toLowerCase().includes(filter.toLowerCase())).sort();
                if (filteredItems.length === 0) { optionsList.innerHTML = '<div class="custom-select-option text-gray-500 italic">Nichts gefunden.</div>'; }
                
                // Leere Option hinzufügen
                const emptyOption = document.createElement('div');
                emptyOption.className = 'custom-select-option';
                emptyOption.textContent = '-';
                emptyOption.dataset.value = "";
                emptyOption.addEventListener('click', (e) => handleSelect(e, ""));
                optionsList.appendChild(emptyOption);

                filteredItems.forEach(item => {
                    const option = document.createElement('div');
                    option.className = 'custom-select-option';
                    option.textContent = item;
                    option.dataset.value = item;
                    if (item === selectedValue) option.classList.add('selected');
                    option.addEventListener('click', (e) => handleSelect(e, item));
                    optionsList.appendChild(option);
                });
            };

            const handleSelect = (e, item) => {
                e.stopPropagation();
                selectedValue = item;
                optionsDiv.classList.remove('active');
                if (onSelectCallback) onSelectCallback(item);
            };

            input.addEventListener('click', e => {
                e.stopPropagation();
                document.querySelectorAll('.custom-select-options.active').forEach(d => { if (d !== optionsDiv) d.classList.remove('active'); });
                optionsDiv.classList.toggle('active');
                if (searchInput) { searchInput.value = ''; searchInput.focus(); }
                renderOptions();
            });

            if (searchInput) searchInput.addEventListener('input', e => renderOptions(e.target.value));
            document.addEventListener('click', () => optionsDiv.classList.remove('active'));

            // Initialen Zustand setzen
            if (onSelectCallback) onSelectCallback(selectedValue);
        }

        // --- SPEZIFISCHE DROPDOWN-ERSTELLER ---
        function createPokemonDropdownSummary(cell, initialValue, playerId, routeId) {
            cell.innerHTML = `
                <div id="icon-container-${playerId}-${routeId}" class="pokemon-icon-display"></div>
                <div id="dropdown-container-${playerId}-${routeId}"></div>
            `;
            const dropdownContainer = cell.querySelector(`#dropdown-container-${playerId}-${routeId}`);
            const iconContainer = cell.querySelector(`#icon-container-${playerId}-${routeId}`);
            const allPokemonNames = allPokemonData.map(p => p.name);

            const onSelect = (pokemonName) => {
                const inputDiv = dropdownContainer.querySelector('.custom-select-input');
                if (inputDiv) inputDiv.textContent = pokemonName || '-';

                iconContainer.innerHTML = '';
                if (pokemonName) {
                    const pokemon = allPokemonData.find(p => p.name === pokemonName);
                    if (pokemon) {
                        iconContainer.innerHTML = `<img src="/static/icons/${pokemon.id}.png" alt="${pokemon.name}" title="${pokemon.name}">`;
                    }
                }
                // Nur ein Update senden, wenn sich der Wert tatsächlich ändert
                const currentCatch = catches.find(c => c.player_id === playerId && c.route_id === routeId);
                if ((currentCatch?.pokemon_name || "") !== (pokemonName || "")) {
                    updateCatchOnServer(playerId, routeId, pokemonName);
                }
            };
            
            setupCustomDropdown(dropdownContainer, 'Pokémon', allPokemonNames, initialValue, onSelect, true);
        }

        function createStatusDropdownSummary(cell, initialValue, routeId) {
            const statusOptions = ["Death Link", "No Catch", ...players.map(p => `Death (${p.name})`)];
            const onSelect = (status) => {
                const inputDiv = cell.querySelector('.custom-select-input');
                if (inputDiv) inputDiv.textContent = status || '-';
                const currentRoute = routes.find(r => r.id === routeId);
                if ((currentRoute?.status || "") !== (status || "")) {
                    updateRouteStatusOnServer(routeId, status);
                }
            };
            setupCustomDropdown(cell, 'Status', statusOptions, initialValue, onSelect, false);
        }

        // --- SERVER- & DATEN-LOGIK ---
        async function updateCatchOnServer(playerId, routeId, pokemonName) {
            socket.emit('update_catch', { player_id: playerId, route_id: routeId, pokemon_name: pokemonName || null });
        }
        async function updateRouteStatusOnServer(routeId, status) {
            socket.emit('update_route_status', { route_id: routeId, status_text: status || "" });
        }

        async function fetchDataAndRenderSummary() {
            try {
                const response = await fetch('/api/data');
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();
                players = data.players; routes = data.routes; catches = data.catches;
                allPokemonData = data.all_pokemon_data || [];
                renderSummaryTable();
                document.getElementById('noDataMessage').classList.toggle('hidden', players.length > 0 || routes.length > 0);
            } catch (error) {
                console.error('Fehler beim Abrufen der Daten:', error);
                document.getElementById('noDataMessage').textContent = 'Fehler beim Laden der Daten.';
                document.getElementById('noDataMessage').classList.remove('hidden');
            }
        }
        
        function renderSummaryTable() {
            const container = document.getElementById('summaryTableContainer');
            container.innerHTML = '';
            const table = document.createElement('table');
            table.className = 'min-w-full bg-white border-collapse dark:bg-gray-800';
            const headers = ['Route', ...players.map(p => p.name), 'Status'];
            let headerHTML = headers.map(text => `<th class="py-2 px-3 border-b-2 border-x border-gray-300 dark:border-gray-600 text-left text-sm font-semibold text-gray-700 dark:text-gray-300 uppercase">${text}</th>`).join('');
            table.innerHTML = `<thead class="bg-blue-100 dark:bg-blue-900/50"><tr>${headerHTML}</tr></thead><tbody></tbody>`;
            
            const tbody = table.querySelector('tbody');
            routes.forEach(route => {
                const row = tbody.insertRow();
                updateRouteRowColor(row, route.status);
                const routeCell = row.insertCell();
                routeCell.className = 'py-2 px-3 border-b border-x border-gray-300 dark:border-gray-600 font-medium align-middle';
                routeCell.textContent = route.name;

                players.forEach(player => {
                    const playerCell = row.insertCell();
                    playerCell.className = 'py-1 px-2 border-b border-x border-gray-300 dark:border-gray-600 w-48 pokemon-cell';
                    const catchedPoke = catches.find(c => c.player_id === player.id && c.route_id === route.id);
                    createPokemonDropdownSummary(playerCell, catchedPoke ? catchedPoke.pokemon_name : null, player.id, route.id);
                });
                
                const statusCell = row.insertCell();
                statusCell.className = 'py-1 px-2 border-b border-x border-gray-300 dark:border-gray-600';
                createStatusDropdownSummary(statusCell, route.status, route.id);
            });
            container.appendChild(table);
        }

        function updateRouteRowColor(row, status) {
            row.className = '';
            if (status === "No Catch") { row.classList.add('status-no-catch'); } 
            else if (status === "Death Link") { row.classList.add('status-death-link'); }
            else if (status && status.startsWith("Death (")) { row.classList.add('status-player-death'); }
        }
        
        // --- THEME-LOGIK ---
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcons = {
            light: document.getElementById('theme-icon-light'),
            dark: document.getElementById('theme-icon-dark'),
        };
        const themes = ['light', 'dark'];
        let currentThemeIndex = 0;

        const applyTheme = (theme) => {
            document.documentElement.classList.remove('dark');
            Object.values(themeIcons).forEach(icon => icon.classList.add('hidden'));
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                themeIcons.dark.classList.remove('hidden');
            } else {
                themeIcons.light.classList.remove('hidden');
            }
            localStorage.setItem('theme', theme);
        };

        themeToggleBtn.addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(themes[currentThemeIndex]);
        });

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme && themes.includes(savedTheme)) {
            currentThemeIndex = themes.indexOf(savedTheme);
            applyTheme(savedTheme);
        }

        // --- SOCKET.IO EVENTS ---
        socket.on('connect', () => { console.log('Verbunden (Kurzansicht)'); fetchDataAndRenderSummary(); });
        socket.on('disconnect', () => console.log('Verbindung getrennt (Kurzansicht)'));
        ['player_added', 'route_added', 'route_deleted', 'routes_reordered', 'all_data_reset', 'full_db_reset', 'global_order_toggled'].forEach(event => {
            socket.on(event, fetchDataAndRenderSummary);
        });
        
        // Granulare Updates für bessere Performance
        socket.on('catch_updated', (data) => {
            const aCatch = catches.find(c => c.player_id === data.player_id && c.route_id === data.route_id);
            if(aCatch) { aCatch.pokemon_name = data.pokemon_name; } else { catches.push(data); }
            const cell = document.querySelector(`#dropdown-container-${data.player_id}-${data.route_id}`)?.parentElement;
            if(cell) createPokemonDropdownSummary(cell, data.pokemon_name, data.player_id, data.route_id);
        });
        socket.on('route_status_updated', (data) => {
            const route = routes.find(r => r.id === data.route_id);
            if(route) { route.status = data.status_text; }
            const row = document.getElementById(`summary-route-row-${data.route_id}`);
            if(row) {
                const cell = row.cells[row.cells.length -1]; // Letzte Zelle ist die Status-Zelle
                updateRouteRowColor(row, data.status_text);
                createStatusDropdownSummary(cell, data.status_text, data.route_id);
            }
        });
    </script>
</body>
</html>
